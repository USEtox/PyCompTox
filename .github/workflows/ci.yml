name: CI

# Disabled: tests are run locally, so this workflow no longer fires on push,
# pull request, or a schedule. It is kept intact and can still be started by
# hand from the Actions tab ("Run workflow"), or with:
#
#     gh workflow run ci.yml --ref main
#
# To re-enable automatic runs, restore the triggers below:
#
#   push:
#     branches: [ main, develop ]
#   pull_request:
#     branches: [ main, develop ]
#   schedule:
#     - cron: '0 4 * * 1'      # weekly, for the slow bulk-endpoint job
#
# Local equivalents of the jobs here:
#
#   pytest -m "not integration"   # offline, no API key needed
#   pytest                        # full suite, needs COMPTOX_API_KEY
#   pytest --run-slow             # includes the slow ToxRefDB bulk endpoints
#   mypy src/pycomptox --ignore-missing-imports
#   flake8 src/ tests/ --select=E9,F63,F7,F82,F401
#   mkdocs build --strict
on:
  workflow_dispatch:

jobs:
  # Offline tests: no API key, no network. These run on every push and PR,
  # including from forks, and are the gate that must stay green.
  unit:
    name: Offline tests on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # -m "not integration" selects the tests conftest.py leaves unmarked:
    # spec conformance, cache, and public API surface.
    - name: Run offline tests with coverage
      run: |
        pytest -m "not integration" -v --cov=pycomptox --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Live-API tests: the whole suite against the real service. Needs the secret,
  # so it is skipped on fork PRs where secrets are unavailable.
  integration:
    name: Live API tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Runs every test file, not just one. The `slow` tests are excluded by
    # default: they hit unfiltered ToxRefDB bulk endpoints that take 15-50s
    # each, which both dominates the runtime and pushes the run into API rate
    # limiting. Add --run-slow to include them.
    - name: Run full test suite
      env:
        COMPTOX_API_KEY: ${{ secrets.CTX_API_KEY }}
      run: pytest -v --durations=15

  # The slow bulk-endpoint tests, on a schedule rather than every push.
  integration-slow:
    name: Live API tests (slow bulk endpoints)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run slow tests
      env:
        COMPTOX_API_KEY: ${{ secrets.CTX_API_KEY }}
      run: pytest -m slow --run-slow -v --durations=15

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # E9,F63,F7,F82 are real errors (syntax, undefined names) - these fail the build.
    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82,F401 --show-source --statistics
        flake8 src/ tests/ --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

    - name: Type check with mypy
      run: mypy src/pycomptox --ignore-missing-imports

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"

    - name: Build documentation
      run: mkdocs build --strict

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: site/
