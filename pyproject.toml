[project]
name = "comptox-python"
version = "0.7.0"
description = "A Python interface for the EPA CompTox Dashboard Chemical API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "USEtox", email = "usetox@example.com"}
]
maintainers = [
    {name = "USEtox", email = "usetox@example.com"}
]
keywords = [
    "comptox",
    "epa",
    "chemistry",
    "toxicology",
    "chemical-data",
    "api-client",
    "cheminformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
    # allowed_methods= on urllib3.util.retry.Retry (base.py) needs >=1.26
    "urllib3>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12.0",
    "types-requests>=2.31.0",
    # configured in [tool.*] below but previously not installed anywhere
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
    "flake8>=7.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/USEtox/PyCompTox"
Documentation = "https://github.com/USEtox/PyCompTox/blob/main/README.md"
Repository = "https://github.com/USEtox/PyCompTox"
Issues = "https://github.com/USEtox/PyCompTox/issues"
Changelog = "https://github.com/USEtox/PyCompTox/blob/main/docs/IMPROVEMENTS_v0.2.0.md"

[project.scripts]
pycomptox-setup = "pycomptox.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycomptox*"]
namespaces = false

[tool.setuptools.package-data]
pycomptox = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
# No python_version pin: recent mypy refuses targets below 3.10, while the
# package still supports 3.9. Type-check against the running interpreter.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_equality = true

# The client modules return decoded JSON, which is `Any` by nature. Their
# annotations document the shape the API is expected to return; mypy cannot
# verify that, so `warn_return_any` produces one unavoidable error per method
# (118 of them) with no signal. It stays enabled for the modules where the
# return type really is checkable: base, cache, config, exceptions.
[[tool.mypy.overrides]]
module = [
    "pycomptox.chemical.*",
    "pycomptox.hazard.*",
    "pycomptox.exposure.*",
    "pycomptox.bioactivity.*",
]
warn_return_any = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "slow: hits ToxRefDB bulk endpoints (15-50s each); skipped unless --run-slow",
    "integration: hits the live CompTox API; needs COMPTOX_API_KEY",
    "unit: runs offline; no API key required",
]

[tool.coverage.run]
source = ["pycomptox"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__main__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
